<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pick Me Up · Infinite Gacha Online</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui-layer">

  <!-- BOOT SCREEN -->
  <div id="boot-ui">
    <div id="boot-border"></div>
    <div id="boot-title">Pick Me Up</div>
    <div id="boot-subtitle">· INFINITE GACHA · O N L I N E ·</div>
    <hr id="boot-rule" />
    <div id="boot-status"></div>
    <div id="boot-bar-wrap"><div id="boot-bar-fill"></div></div>
    <div id="boot-fade"></div>
  </div>

  <!-- POPUP CONTAINER -->
  <div id="popup-container"></div>

  <!-- HUB UI -->
  <div id="hub-ui">

    <!-- TOP HUD BAR -->
    <div id="hub-topbar">
      <div id="hub-player-info">
        <img id="hub-avatar" src="assets/tempFace.png" alt="avatar" />
        <div id="hub-player-details">
          <span id="hub-player-name">???</span>
        </div>
      </div>
      <div id="hub-currencies">
        <div class="currency-item"><img src="assets/mainArt/Energy.webp" alt="⚡"><span id="hub-energy">100</span></div>
        <div class="currency-item"><img src="assets/mainArt/Gems.webp" alt="💎"><span id="hub-gems">0</span></div>
        <div class="currency-item"><img src="assets/mainArt/Gold.webp" alt="🪙"><span id="hub-gold">0</span></div>
        <button class="hub-topbar-icon" onclick="hubNav('Mail')"><img src="assets/Mail.png" alt="Mail"><span id="mail-badge">0</span></button>
        <button class="hub-topbar-icon" onclick="hubNav('Settings')"><img src="assets/Settings.png" alt="Settings"></button>
      </div>
    </div>

    <!-- LEFT FLOATING BUTTONS -->
    <div id="hub-float-left">
      <button class="hub-float-btn" onclick="hubNav('Shop')"><img src="assets/mainArt/Shop.webp" alt=""><span>Shop</span></button>
      <button class="hub-float-btn" data-nav="Synthesis" onclick="hubNav('Synthesis')"><img src="assets/mainArt/PostSyntheisHeroPowder.webp" alt=""><span>Synthesis</span></button>
      <button class="hub-float-btn" onclick="hubNav('Promotion')"><img src="assets/mainArt/Exp.webp" alt=""><span>Promote</span></button>
    </div>

    <!-- RIGHT FLOATING BUTTONS -->
    <div id="hub-float-right">
      <button class="hub-float-btn" onclick="hubNav('Quest')" style="position:relative"><img src="assets/mainArt/Quest.webp" alt=""><span>Quest</span><span id="quest-badge"></span></button>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div id="hub-main"></div>

    <!-- BOTTOM NAV BAR -->
    <div id="hub-bottombar">
      <div class="hub-nav-group" id="hub-nav-left">
        <button class="hub-nav-btn" data-nav="Lobby" onclick="hubNav('Lobby')"><img src="assets/mainArt/TownHall.webp"><span>Lobby</span></button>
        <button class="hub-nav-btn" data-nav="Knights" onclick="hubNav('Knights')"><img src="assets/mainArt/Knightsummontoken.webp"><span>Knights</span></button>
        <button class="hub-nav-btn" data-nav="Summon" onclick="hubNav('Summon')"><img src="assets/mainArt/Summon.webp"><span>Summon</span></button>
        <button class="hub-nav-btn" data-nav="Inventory" onclick="hubNav('Inventory')"><img src="assets/mainArt/Inventory.webp"><span>Inventory</span></button>
        <button class="hub-nav-btn" data-nav="Tutorial" onclick="hubNav('Tutorial')" style="border:1px dashed rgba(255,215,0,0.4);opacity:0.75"><img src="assets/mainArt/Quest.webp"><span>Tutorial</span></button>
        <button class="hub-nav-btn" onclick="if(confirm('Reset ALL progress?')){localStorage.removeItem('pickmeup_save');location.reload()}" style="border:1px dashed rgba(255,100,100,0.4);opacity:0.75"><img src="assets/mainArt/Quest.webp"><span>Restart</span></button>
      </div>
      <div class="hub-nav-group" id="hub-nav-right">
        <button class="hub-nav-btn" data-nav="Dungeon" onclick="hubNav('Dungeon')"><img src="assets/mainArt/Dungeon.webp"><span>Dungeon</span></button>
        <button class="hub-nav-btn" data-nav="Arena" onclick="hubNav('Arena')"><img src="assets/mainArt/Arena.webp"><span>Arena</span></button>
        <button class="hub-nav-btn hub-nav-featured" data-nav="Tower" onclick="hubNav('Tower')"><img src="assets/mainArt/Tower.webp"><span>Tower</span></button>
      </div>
    </div>

  </div>

  <!-- TUTORIAL UI -->
  <div id="tutorial-ui">
    <div id="tutorial-text">[ Tutorial — Coming Soon ]</div>
    <button class="popup-btn" onclick="showHub()">[ SKIP ]</button>
  </div>

  <!-- PULL ANIMATION OVERLAY -->
  <div id="pull-anim-overlay">
    <div id="pull-flash"></div>
    <div id="pull-shake-container">
      <div id="pull-cards-area"></div>
    </div>
    <div id="pull-tap-prompt" style="display:none">[ TAP TO CONTINUE ]</div>
  </div>

  <!-- HERO DETAIL OVERLAY -->
  <div id="hero-detail-overlay">
    <div id="hero-detail-panel"></div>
  </div>

  <!-- TUTORIAL OVERLAY -->
  <div id="tut-overlay">
    <div id="tut-combat-scene">
      <canvas id="tut-combat-canvas"></canvas>
    </div>
    <div id="tut-dialogue">
      <canvas id="tut-portrait" width="64" height="64"></canvas>
      <canvas id="tut-combat-portrait" width="100" height="100"></canvas>
      <div id="tut-dialogue-inner">
        <span id="tut-speaker-name" class="tut-speaker"></span>
        <div id="tut-dialogue-text"></div>
        <div id="tut-continue">&gt; tap to continue</div>
      </div>
    </div>
    <div id="tut-choice">
      <div id="tut-choice-text"></div>
      <div class="tut-choice-btns">
        <button id="tut-yes">[ YES ]</button>
        <button id="tut-no">[ NO ]</button>
      </div>
    </div>
  </div>

  <!-- DEBUG TOAST -->
  <div id="debug-toast"></div>

  <!-- RESULTS OVERLAY -->
  <div id="results-overlay">
    <div id="results-panel">
      <div id="results-header">[SUMMON RESULTS]</div>
      <div id="results-list"></div>
      <div id="results-btn-row">
        <button class="popup-btn" id="res-add-btn">[ ADD TO INVENTORY ]</button>
        <button class="popup-btn" id="res-again-btn">[ SUMMON AGAIN ]</button>
      </div>
    </div>
  </div>

</div>

<!-- Game scripts — order matters -->
<script src="js/gameState.js"></script>
<script src="js/ui/helpers.js"></script>
<script src="js/debug.js"></script>
<script src="js/scenes/boot.js"></script>
<script src="js/scenes/intro.js"></script>
<script src="js/scenes/hub.js"></script>
<script src="js/scenes/heroes.js"></script>
<script src="js/scenes/summon.js"></script>
<script src="js/systems/spriteAnimator.js"></script>
<script src="js/systems/enemies.js"></script>
<script src="js/systems/statusEffects.js"></script>
<script src="js/systems/combat.js"></script>
<script src="js/systems/mailbox.js"></script>
<script src="js/systems/afkRewards.js"></script>
<script src="js/systems/dailyQuests.js"></script>
<script src="js/systems/tutorial.js"></script>
<script src="js/scenes/tower.js"></script>
<script src="js/scenes/dungeons.js"></script>
<script src="js/scenes/synthesis.js"></script>
<script src="js/scenes/promotion.js"></script>
<script src="js/scenes/shop.js"></script>
<script src="js/scenes/manor.js"></script>
<script src="js/scenes/inventory.js"></script>
<script src="js/scenes/battle.js"></script>
<script src="js/scenes/arena.js"></script>
<script src="js/main.js"></script>
</body>
</html>
